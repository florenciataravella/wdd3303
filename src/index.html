<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>

  <body>
    <header class="divider" id="ajaxHeader">
    </header>

      <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep

          </p>
        </div>
      </div>
      
      <section class="products">
        <ul class="product-grid">
          <li>
            <a href="/product_listing/index.html?category=tents">
          
              <div>
                    <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-tents.svg" alt="personalized training icon" width="120" height="100" >
                   
                </div>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=backpacks">
        
              <div>
                    <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-backpacks.svg" alt="coach led classes icon" width="100" height="90">
                 
                </div>
             
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=sleeping-bags">
             
               <div>
                    <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-sleepingbags.svg" alt="personalized training icon" width="120" height="100">
                 
                </div>
            </a>
          </li>
          <li>
            <a href="/product_listing/index.html?category=hammocks">
              <div>
                    <img src="https://byui-cse.github.io/wdd330-ww-course/images/category-hammocks.svg" alt="personalized training icon" width="120" height="100">
                  
                </div>
              
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="ajaxFooter">
      
    </footer>
